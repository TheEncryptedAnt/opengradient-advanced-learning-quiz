<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenGradient</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f0f1a;
}

/* Animated Web3 Grid Background */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:
  linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size:60px 60px;
  animation:gridMove 25s linear infinite;
  z-index:0;
}

@keyframes gridMove{
  from{transform:translateY(0);}
  to{transform:translateY(-60px);}
}

/* Glow Orbs */
.glow{
  position:absolute;
  width:500px;
  height:500px;
  background:radial-gradient(circle,#00f2fe33,transparent 70%);
  filter:blur(100px);
  animation:moveGlow 12s infinite alternate ease-in-out;
}

.glow2{
  top:20%;
  left:60%;
  animation-delay:4s;
}

@keyframes moveGlow{
  from{transform:translate(-50px,-50px);}
  to{transform:translate(50px,50px);}
}

/* Glass Card */
.card{
  position:relative;
  z-index:1;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  padding:60px;
  border-radius:22px;
  text-align:center;
  max-width:750px;
  box-shadow:0 0 40px rgba(0,255,255,0.15);
}

/* Title */
h1{
  font-size:42px;
  letter-spacing:1px;
  background:linear-gradient(90deg,#00f2fe,#4facfe,#8e2de2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tagline{
  margin-top:12px;
  font-size:15px;
  opacity:0.75;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* Main Text */
.description{
  margin-top:30px;
  font-size:18px;
  line-height:1.6;
  font-weight:500;
}

/* Button */
.start-btn{
  display:inline-block;
  margin-top:45px;
  padding:18px 48px;
  font-size:18px;
  border-radius:14px;
  background:linear-gradient(90deg,#00f2fe,#4facfe);
  color:#000;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
  box-shadow:0 0 20px rgba(0,242,254,0.5);
}

.start-btn:hover{
  transform:translateY(-6px);
  box-shadow:0 0 35px rgba(0,242,254,0.9);
}

/* Minimal Footer */
.footer{
  margin-top:40px;
  font-size:13px;
  opacity:0.6;
}

.footer a{
  color:#00f2fe;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow glow2"></div>

<div class="card">

  <h1>OpenGradient</h1>

  <div class="tagline">
    Learn. Test. Contribute.
  </div>

  <div class="description">
    This isn’t just a quiz.<br>
    It’s a signal check.<br><br>
    How well do you really understand the ecosystem?
  </div>

  <a href="quiz.html" class="start-btn">
    Enter →
  </a>

  <div class="footer">
    Built by 
    <a href="https://x.com/TheEncryptedAnt" target="_blank">
      @TheEncryptedAnt
    </a>
    ·
    <a href="https://docs.opengradient.ai/" target="_blank">
      Docs
    </a>
  </div>

</div>

</body>
</html>
