<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenGradient Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  height:100vh;
  overflow:hidden;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(-45deg,#1e1e2f,#302b63,#24243e,#1f1c2c);
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
}

/* Moving Gradient */
@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Floating particles */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:#00f2fe;
  border-radius:50%;
  opacity:0.5;
  animation:float 10s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh) scale(0);}
  100%{transform:translateY(-10vh) scale(1);}
}

/* Glass Card */
.card{
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  padding:50px;
  border-radius:20px;
  text-align:center;
  max-width:750px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.logo img{
  width:70px;
  margin-bottom:15px;
}

h1{
  font-size:34px;
  background:linear-gradient(90deg,#00f2fe,#4facfe);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:pulse 3s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;}
  50%{opacity:0.8;}
}

.subtitle{
  margin-top:10px;
  opacity:0.85;
  font-size:16px;
}

.description{
  margin-top:25px;
  line-height:1.6;
  opacity:0.9;
}

/* Start Button */
.start-btn{
  display:inline-block;
  margin-top:40px;
  padding:16px 40px;
  font-size:18px;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2fe,#4facfe);
  color:#000;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}

.start-btn:hover{
  transform:translateY(-4px);
  box-shadow:0 15px 35px rgba(0,242,254,0.5);
}

/* Leaderboard preview */
.leaderboard{
  margin-top:35px;
  font-size:14px;
  opacity:0.8;
}

.footer{
  margin-top:30px;
  font-size:13px;
  opacity:0.7;
}

.footer a{
  color:#00f2fe;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- Floating particles -->
<script>
for(let i=0;i<20;i++){
  const p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(5+Math.random()*10)+"s";
  document.body.appendChild(p);
}
</script>

<div class="card">

  <div class="logo">
    <img src="opengradient-logo.png">
  </div>

  <h1>OpenGradient Quiz</h1>

  <div class="subtitle">
    Test Your Real Ecosystem Understanding
  </div>

  <div class="description">
    Explore how well you understand decentralization,
    contribution culture, and OpenGradient’s long-term vision.
  </div>

  <a href="quiz.html" class="start-btn">🚀 Start</a>

  <div class="leaderboard">
    🏆 Highest Score: 15 / 15<br>
    🎯 Can you beat it?
  </div>

  <div class="footer">
    Built by 
    <a href="https://x.com/TheEncryptedAnt" target="_blank">
      @TheEncryptedAnt
    </a>
    <br><br>
    <a href="https://docs.opengradient.ai/" target="_blank">
      Learn more →
    </a>
  </div>

</div>

</body>
</html>
