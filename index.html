<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenGradient</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
  background:#050510;
  color:#fff;
  overflow:hidden;
}

/* INTRO SCREEN */
#intro{
  position:fixed;
  width:100%;
  height:100%;
  background:#050510;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

/* Logo Glow */
.intro-logo{
  width:90px;
  margin-bottom:30px;
  animation:logoGlow 2s infinite alternate;
}

@keyframes logoGlow{
  from{filter:drop-shadow(0 0 5px #00f2fe);}
  to{filter:drop-shadow(0 0 25px #8e2de2);}
}

/* Typing Text */
.typing{
  font-size:20px;
  letter-spacing:3px;
  border-right:2px solid #00f2fe;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  animation:typing 3s steps(25,end) forwards, blink .8s infinite;
}

@keyframes typing{
  from{width:0}
  to{width:340px}
}

@keyframes blink{
  50%{border-color:transparent;}
}

/* FADE OUT */
.fade-out{
  opacity:0;
  transition:1s ease;
}

/* MAIN HOME */
#home{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:radial-gradient(circle at top left,#141e30,#243b55);
}

.card{
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.06);
  padding:60px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 50px rgba(0,255,255,0.2);
}

.card h1{
  font-size:40px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.start-btn{
  display:inline-block;
  margin-top:40px;
  padding:16px 50px;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  color:#000;
  text-decoration:none;
  font-weight:bold;
  transition:.3s;
}

.start-btn:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px #00f2fe;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <img src="opengradient-logo.png" class="intro-logo">
  <div class="typing">Initializing On-Chain Layer...</div>
</div>

<!-- HOME -->
<div id="home" style="display:none;">
  <div class="card">
    <h1>OpenGradient</h1>
    <p style="margin-top:20px;opacity:.8;">
      Real ecosystem understanding starts here.
    </p>
    <a href="quiz.html" class="start-btn">Enter →</a>
  </div>
</div>

<script>

/* AUTO TRANSITION AFTER 4s */
setTimeout(()=>{
  const intro=document.getElementById('intro');
  intro.classList.add('fade-out');

  setTimeout(()=>{
    intro.style.display="none";
    document.getElementById('home').style.display="flex";
  },1000);

},4000);

</script>

</body>
</html>
