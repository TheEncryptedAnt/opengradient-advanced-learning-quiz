<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OpenGradient Learning Quiz</title>
<style>
body{
  margin:0;
  font-family: Inter, Arial, sans-serif;
  background: radial-gradient(circle at top, #1e3a8a, #020617 60%);
  color:#e5e7eb;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:#020617;
  padding:40px;
  border-radius:18px;
  border:1px solid #1e293b;
  max-width:520px;
  text-align:center;
}
.logo{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(90deg,#60a5fa,#818cf8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
p{
  color:#94a3b8;
  font-size:14px;
  margin-top:10px;
}
button{
  margin-top:25px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:10px;
  font-weight:600;
  background:linear-gradient(90deg,#2563eb,#4f46e5);
  color:#fff;
  cursor:pointer;
}
.footer{
  margin-top:22px;
  font-size:13px;
}
a{color:#60a5fa;text-decoration:none;font-weight:600;}
</style>
</head>

<body>
  <div class="card">
    <div class="logo">OpenGradient</div>
    <p>
      Community-driven learning for decentralized AI, models, data and compute.
    </p>

    <button onclick="location.href='quiz.html'">Start Quiz</button>

    <div class="footer">
      Built by  
      <a href="https://x.com/TheEncryptedAnt" target="_blank">
        @TheEncryptedAnt
      </a>
    </div>
  </div>
</body>
</html>
