<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenGradient Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top left, #1f1c2c, #302b63, #24243e);
  color: #fff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Glass Card */
.card {
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  max-width: 720px;
  padding: 60px 50px;
  border-radius: 22px;
  box-shadow: 0 25px 70px rgba(0,0,0,0.6);
  text-align: center;
}

/* Logo */
.logo img {
  width: 65px;
  margin-bottom: 20px;
}

/* Title */
h1 {
  font-size: 34px;
  margin-bottom: 18px;
  background: linear-gradient(90deg, #00f2fe, #4facfe);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Clean Description */
.description {
  font-size: 17px;
  line-height: 1.7;
  opacity: 0.9;
  max-width: 520px;
  margin: 0 auto;
}

/* Button */
.start-btn {
  display: inline-block;
  margin-top: 45px;
  padding: 18px 42px;
  font-size: 18px;
  border-radius: 14px;
  background: linear-gradient(90deg, #00f2fe, #4facfe);
  color: #000;
  text-decoration: none;
  font-weight: 600;
  transition: 0.3s;
}

.start-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 35px rgba(0,242,254,0.4);
}

/* Footer */
.footer {
  margin-top: 50px;
  font-size: 14px;
  opacity: 0.8;
}

.footer a {
  color: #00f2fe;
  text-decoration: none;
  font-weight: 500;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <img src="opengradient-logo.png" alt="OpenGradient Logo">
  </div>

  <h1>OpenGradient Quiz</h1>

  <div class="description">
    Ready to test your real ecosystem understanding?
    <br><br>
    Explore how well you understand decentralization, contribution culture,
    and OpenGradient’s vision.
  </div>

  <a href="quiz.html" class="start-btn">🚀 Start</a>

  <div class="footer">
    Built by 
    <a href="https://x.com/TheEncryptedAnt" target="_blank">
      @TheEncryptedAnt
    </a>
    <br><br>
    <a href="https://docs.opengradient.ai/" target="_blank">
      Explore OpenGradient Docs →
    </a>
  </div>

</div>

</body>
</html>
