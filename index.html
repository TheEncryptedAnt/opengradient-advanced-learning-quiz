<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenGradient Advanced Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      padding: 40px;
    }
    .quiz-box {
      max-width: 600px;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 10px;
    }
    .question {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .option {
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
    }
    .option.correct {
      background: #d4edda;
      border-color: #28a745;
    }
    .option.wrong {
      background: #f8d7da;
      border-color: #dc3545;
    }
    .option.disabled {
      pointer-events: none;
    }
    .explanation {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
    }
    button {
      margin-top: 20px;
      padding: 10px 16px;
      border: none;
      background: #4f46e5;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="quiz-box">
  <h1>OpenGradient Quiz</h1>
  <div id="quiz"></div>
  <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next</button>
</div>

<script>
const questions = [
  {
    question: "What is the primary goal of OpenGradient?",
    options: [
      "AI content generation",
      "Centralized AI hosting",
      "Decentralized AI computation",
      "GPU rental marketplace"
    ],
    correct: 2,
    explanation: "OpenGradient focuses on decentralized AI computation."
  },
  {
    question: "Who plays an active role in OpenGradient?",
    options: [
      "Only core team",
      "Passive users",
      "Community contributors",
      "No one"
    ],
    correct: 2,
    explanation: "OpenGradient is community-driven."
  }
];

let current = 0;
let score = 0;

function loadQuestion() {
  const q = questions[current];
  let html = `<div class="question">${q.question}</div>`;
  q.options.forEach((opt, i) => {
    html += `<div class="option" onclick="selectOption(${i}, this)">${opt}</div>`;
  });
  document.getElementById("quiz").innerHTML = html;
  document.getElementById("nextBtn").style.display = "none";
}

function selectOption(index, el) {
  const q = questions[current];
  const options = document.querySelectorAll(".option");
  options.forEach(o => o.classList.add("disabled"));

  if (index === q.correct) {
    el.classList.add("correct");
    score++;
  } else {
    el.classList.add("wrong");
    options[q.correct].classList.add("correct");
  }

  const exp = document.createElement("div");
  exp.className = "explanation";
  exp.innerText = q.explanation;
  document.getElementById("quiz").appendChild(exp);

  document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    document.getElementById("quiz").innerHTML =
      `<h2>Finished!</h2><p>Score: ${score}/${questions.length}</p>`;
    document.getElementById("nextBtn").style.display = "none";
  }
}

loadQuestion();
</script>

</body>
</html>
