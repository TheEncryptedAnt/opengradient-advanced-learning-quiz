<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenGradient</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
  background:#050510;
  color:#fff;
  overflow:hidden;
  cursor:none;
}

/* CURSOR GLOW */
.cursor{
  position:fixed;
  width:20px;
  height:20px;
  border-radius:50%;
  background:radial-gradient(circle,#00f2fe,#8e2de2);
  pointer-events:none;
  mix-blend-mode:screen;
  transform:translate(-50%,-50%);
  transition:0.05s;
  z-index:10000;
}

/* INTRO SCREEN */
#intro{
  position:fixed;
  width:100%;
  height:100%;
  background:#050510;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

/* Logo Glow */
.intro-logo{
  width:90px;
  margin-bottom:30px;
  animation:logoGlow 2s infinite alternate;
}

@keyframes logoGlow{
  from{filter:drop-shadow(0 0 5px #00f2fe);}
  to{filter:drop-shadow(0 0 30px #8e2de2);}
}

/* Typing Text */
.typing{
  font-size:20px;
  letter-spacing:3px;
  border-right:2px solid #00f2fe;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  animation:typing 3s steps(25,end) forwards, blink .8s infinite;
}

@keyframes typing{
  from{width:0}
  to{width:340px}
}

@keyframes blink{
  50%{border-color:transparent;}
}

.fade-out{
  opacity:0;
  transition:1s ease;
}

/* HOME */
#home{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* Moving Grid */
#home::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background-image: linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size:60px 60px;
  animation:gridMove 20s linear infinite;
}

@keyframes gridMove{
  from{transform:translate(0,0);}
  to{transform:translate(-60px,-60px);}
}

/* Floating Particles */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:#00f2fe;
  border-radius:50%;
  animation:float 6s infinite ease-in-out;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-20px);}
}

/* Neon Card */
.card{
  position:relative;
  padding:80px;
  border-radius:30px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(30px);
  text-align:center;
  transition:0.4s;
  box-shadow:0 0 40px rgba(0,255,255,0.3);
  border:1px solid rgba(0,255,255,0.3);
}

.card:hover{
  transform:rotateX(6deg) rotateY(-6deg);
  box-shadow:0 0 70px rgba(0,255,255,0.8);
}

/* Border Pulse */
.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:30px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2,#00f2fe);
  z-index:-1;
  filter:blur(20px);
  opacity:0.6;
  animation:borderPulse 4s linear infinite;
}

@keyframes borderPulse{
  0%{opacity:0.3;}
  50%{opacity:0.9;}
  100%{opacity:0.3;}
}

/* Heading */
.card h1{
  font-size:50px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:20px;
}

/* Button */
.start-btn{
  display:inline-block;
  margin-top:40px;
  padding:18px 60px;
  border-radius:15px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  color:#000;
  font-weight:bold;
  text-decoration:none;
  font-size:18px;
  transition:.3s;
}

.start-btn:hover{
  transform:translateY(-5px);
  box-shadow:0 0 40px #00f2fe;
}
</style>
</head>

<body>

<div class="cursor"></div>

<!-- INTRO -->
<div id="intro">
  <img src="opengradient-logo.png" class="intro-logo">
  <div class="typing">Initializing On-Chain Intelligence...</div>
</div>

<!-- HOME -->
<div id="home" style="display:none;">
  <div class="card">
    <h1>OpenGradient</h1>
    <p style="opacity:.8;">Explore the On-Chain Intelligence Layer</p>
    <a href="quiz.html" class="start-btn">Enter →</a>
  </div>
</div>

<script>

/* Cursor Glow */
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",(e)=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* Floating Particles */
for(let i=0;i<25;i++){
  const p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"%";
  p.style.top=Math.random()*100+"%";
  p.style.animationDelay=Math.random()*5+"s";
  document.getElementById("home").appendChild(p);
}

/* Intro Transition */
setTimeout(()=>{
  const intro=document.getElementById('intro');
  intro.classList.add('fade-out');

  setTimeout(()=>{
    intro.style.display="none";
    document.getElementById('home').style.display="flex";
  },1000);

},4000);

</script>

</body>
</html>
