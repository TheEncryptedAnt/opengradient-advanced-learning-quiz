<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenGradient</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:#07070f;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:opacity .6s ease;
}

/* Cursor Glow */
.cursor{
  position:fixed;
  width:400px;
  height:400px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,#00f2fe22,transparent 70%);
  transform:translate(-50%,-50%);
  z-index:0;
}

/* Neon Grid Background */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:
  linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,0,255,0.05) 1px, transparent 1px);
  background-size:70px 70px;
  animation:gridMove 20s linear infinite;
}

@keyframes gridMove{
  from{transform:translateY(0);}
  to{transform:translateY(-70px);}
}

/* Card */
.card{
  position:relative;
  z-index:1;
  width:700px;
  padding:60px;
  border-radius:25px;
  backdrop-filter:blur(30px);
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(0,255,255,0.3);
  box-shadow:
    0 0 30px #00f2fe33,
    0 0 80px #8e2de233;
  text-align:center;
  transition:transform .2s ease;
}

/* Neon Title */
h1{
  font-size:44px;
  letter-spacing:2px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2,#00f2fe);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:neonPulse 3s infinite alternate;
}

@keyframes neonPulse{
  from{filter:drop-shadow(0 0 5px #00f2fe);}
  to{filter:drop-shadow(0 0 20px #8e2de2);}
}

.tagline{
  margin-top:15px;
  letter-spacing:3px;
  font-size:14px;
  opacity:.7;
  text-transform:uppercase;
}

/* Description */
.description{
  margin-top:35px;
  font-size:19px;
  line-height:1.6;
  font-weight:500;
}

/* Neon Button */
.start-btn{
  display:inline-block;
  margin-top:50px;
  padding:18px 60px;
  font-size:18px;
  border-radius:15px;
  text-decoration:none;
  font-weight:bold;
  color:#000;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  box-shadow:0 0 25px #00f2fe;
  transition:.3s;
}

.start-btn:hover{
  transform:translateY(-6px);
  box-shadow:0 0 45px #8e2de2;
}

/* Footer */
.footer{
  margin-top:45px;
  font-size:13px;
  opacity:.6;
}

.footer a{
  color:#00f2fe;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="cursor"></div>

<div class="card" id="card">

  <h1>OpenGradient</h1>

  <div class="tagline">
    On-Chain Intelligence Layer
  </div>

  <div class="description">
    Not hype. Not noise.<br>
    Just understanding.<br><br>
    Enter the ecosystem.
  </div>

  <a href="quiz.html" class="start-btn" onclick="fadeOut(event)">
    Enter →
  </a>

  <div class="footer">
    Built by 
    <a href="https://x.com/TheEncryptedAnt" target="_blank">
      @TheEncryptedAnt
    </a>
    · 
    <a href="https://docs.opengradient.ai/" target="_blank">
      Docs
    </a>
  </div>

</div>

<script>

/* Cursor Glow Follow */
const cursor=document.querySelector('.cursor');
document.addEventListener('mousemove',e=>{
  cursor.style.left=e.clientX+'px';
  cursor.style.top=e.clientY+'px';
});

/* Parallax Tilt */
const card=document.getElementById('card');
document.addEventListener('mousemove',e=>{
  const x=(window.innerWidth/2 - e.clientX)/25;
  const y=(window.innerHeight/2 - e.clientY)/25;
  card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;
});

/* Smooth Page Transition */
function fadeOut(e){
  e.preventDefault();
  document.body.style.opacity=0;
  setTimeout(()=>{
    window.location.href="quiz.html";
  },600);
}
</script>

</body>
</html>
