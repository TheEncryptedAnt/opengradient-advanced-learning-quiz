<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenGradient Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
  background:#050510;
  color:#fff;
  overflow:hidden;
}

/* Moving Grid Background */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background-image: linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size:60px 60px;
  animation:gridMove 20s linear infinite;
  z-index:-1;
}

@keyframes gridMove{
  from{transform:translate(0,0);}
  to{transform:translate(-60px,-60px);}
}

/* Container */
.container{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Neon Card */
.card{
  width:850px;
  padding:60px;
  border-radius:30px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(25px);
  border:1px solid rgba(0,255,255,0.3);
  box-shadow:0 0 50px rgba(0,255,255,0.3);
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h1{
  font-size:28px;
  margin-bottom:25px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* Progress Bar */
.progress-bar{
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:30px;
}

.progress{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  box-shadow:0 0 20px #00f2fe;
  transition:0.4s;
}

/* Question */
.question{
  font-size:20px;
  margin-bottom:25px;
}

/* Options */
.options button{
  width:100%;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(0,255,255,0.3);
  background:rgba(255,255,255,0.05);
  color:#fff;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

.options button:hover{
  background:rgba(0,255,255,0.1);
  box-shadow:0 0 15px #00f2fe;
  transform:translateY(-2px);
}

.correct{
  background:#00ff99 !important;
  color:#000;
}

.wrong{
  background:#ff3c6f !important;
}

/* Result Screen */
.result{
  text-align:center;
}

.result h2{
  font-size:30px;
  margin-bottom:20px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.main-btn{
  display:inline-block;
  margin-top:30px;
  padding:14px 40px;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2fe,#8e2de2);
  color:#000;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
  transition:.3s;
}

.main-btn:hover{
  transform:translateY(-4px);
  box-shadow:0 0 25px #00f2fe;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>OpenGradient Knowledge Layer</h1>
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
    <div id="quiz"></div>
  </div>
</div>

<script src="questions.js"></script>

<script>
let current=0;
let score=0;
let answered=false;

const quizEl=document.getElementById("quiz");
const progressEl=document.getElementById("progress");

function loadQuestion(){
  answered=false;
  const q=questions[current];
  progressEl.style.width=((current/questions.length)*100)+"%";

  quizEl.innerHTML=`
    <div class="question">
      Question ${current+1} / ${questions.length}<br><br>
      ${q.question}
    </div>
    <div class="options">
      ${q.options.map((opt,i)=>
        `<button onclick="selectOption(${i})">${opt}</button>`
      ).join("")}
    </div>
  `;
}

function selectOption(index){
  if(answered)return;
  answered=true;

  const q=questions[current];
  const buttons=document.querySelectorAll(".options button");

  buttons.forEach((b,i)=>{
    if(i===q.correctIndex)b.classList.add("correct");
    if(i===index && i!==q.correctIndex)b.classList.add("wrong");
    b.disabled=true;
  });

  if(index===q.correctIndex)score++;

  setTimeout(()=>{
    nextQuestion();
  },1200);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  progressEl.style.width="100%";

  quizEl.innerHTML=`
    <div class="result">
      <h2>Layer Completed</h2>
      <p>You scored <strong>${score}</strong> / ${questions.length}</p>

      <a href="index.html" class="main-btn">
        Back to Home
      </a>
    </div>
  `;
}

loadQuestion();
</script>

</body>
</html>
