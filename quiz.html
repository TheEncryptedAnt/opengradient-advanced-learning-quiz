<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenGradient Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle at top left,#141e30,#243b55);
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  max-width:750px;
  padding:40px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(25px);
  border-radius:18px;
  box-shadow:0 25px 60px rgba(0,0,0,0.4);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.logo img{
  width:42px;
}

.progress-bar{
  height:5px;
  background:rgba(255,255,255,0.15);
  border-radius:10px;
  margin:20px 0;
  overflow:hidden;
}

.progress{
  height:100%;
  background:linear-gradient(90deg,#00f5a0,#00d9f5);
  width:0%;
  transition:0.4s ease;
}

.question{
  font-size:19px;
  margin:25px 0;
}

.options button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.08);
  color:#fff;
  font-size:15px;
  cursor:pointer;
}

.options button:hover{
  background:rgba(255,255,255,0.15);
}

.correct{
  background:#1f4d2f !important;
  border-color:#2ecc71 !important;
}

.wrong{
  background:#4d1f2a !important;
  border-color:#e74c3c !important;
}

.main-btn{
  margin-top:20px;
  padding:12px 22px;
  border:none;
  border-radius:8px;
  background:linear-gradient(90deg,#00f5a0,#00d9f5);
  color:#000;
  font-weight:600;
  cursor:pointer;
}

.footer{
  margin-top:30px;
  text-align:center;
  font-size:13px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">
    <img src="opengradient-logo.png">
    <h2>OpenGradient Advanced Learning Quiz</h2>
  </div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <div id="quiz"></div>

  <div class="footer">
    Built by @TheEncryptedAnt
  </div>
</div>

<script src="questions.js"></script>

<script>
let current=0;
let score=0;
let answered=false;

const quizEl=document.getElementById("quiz");
const progressEl=document.getElementById("progress");

function loadQuestion(){
  answered=false;
  const q=questions[current];
  progressEl.style.width=((current/questions.length)*100)+"%";

  quizEl.innerHTML=`
    <div class="question">
      Question ${current+1} of ${questions.length}<br><br>
      ${q.question}
    </div>
    <div class="options">
      ${q.options.map((opt,i)=>
        `<button onclick="selectOption(${i})">${opt}</button>`
      ).join("")}
    </div>
  `;
}

function selectOption(index){
  if(answered)return;
  answered=true;

  const q=questions[current];
  const buttons=document.querySelectorAll(".options button");

  buttons.forEach((b,i)=>{
    if(i===q.correctIndex)b.classList.add("correct");
    if(i===index && i!==q.correctIndex)b.classList.add("wrong");
    b.disabled=true;
  });

  if(index===q.correctIndex)score++;

  setTimeout(()=>{nextQuestion();},1000);
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  quizEl.innerHTML=`
    <h2>🎉 Quiz Completed!</h2>
    <p>You scored <strong>${score}</strong> out of <strong>${questions.length}</strong></p>

    <button class="main-btn" onclick="window.location.href='index.html'">
      ⬅ Back to Home
    </button>

    <br><br>

    <a href="https://docs.opengradient.ai/" target="_blank" style="color:#00f5d4;">
      Learn more from OpenGradient Docs →
    </a>
  `;
}

loadQuestion();
</script>

</body>
</html>
