<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OpenGradient Advanced Learning Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top left,#1f1c2c,#302b63,#24243e);
  color:#fff;
}

.container{
  max-width:800px;
  margin:60px auto;
  padding:40px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  box-shadow:0 30px 60px rgba(0,0,0,0.4);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.logo img{
  width:45px;
  height:45px;
}

h1{
  margin:0;
  font-size:24px;
}

.progress-bar{
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:10px;
  margin:20px 0;
  overflow:hidden;
}

.progress{
  height:100%;
  background:linear-gradient(90deg,#00f5a0,#00d9f5);
  width:0%;
  transition:0.4s ease;
}

.question{
  font-size:20px;
  margin:25px 0;
}

.options button{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.08);
  color:#fff;
  font-size:15px;
  cursor:pointer;
  transition:0.2s ease;
}

.options button:hover{
  background:rgba(255,255,255,0.15);
  transform:translateY(-2px);
}

.correct{
  background:#1f4d2f !important;
  border-color:#2ecc71 !important;
}

.wrong{
  background:#4d1f2a !important;
  border-color:#e74c3c !important;
}

.explanation{
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:rgba(0,0,0,0.3);
  font-size:14px;
}

.next-btn{
  margin-top:20px;
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:linear-gradient(90deg,#00f5a0,#00d9f5);
  color:#000;
  font-weight:600;
  cursor:pointer;
}

.next-btn:hover{
  opacity:0.9;
}

.result{
  text-align:center;
}

.result h2{
  margin-bottom:10px;
}

.footer{
  margin-top:35px;
  text-align:center;
  font-size:13px;
  opacity:0.8;
}

.footer a{
  color:#00f5d4;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">
    <img src="opengradient-logo.png">
    <h1>OpenGradient Advanced Learning Quiz</h1>
  </div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <div id="quiz"></div>

  <div class="footer">
    Built by <a href="https://x.com/TheEncryptedAnt" target="_blank">@TheEncryptedAnt</a>
  </div>
</div>

<script src="questions.js"></script>

<script>
let current=0;
let score=0;
let answered=false;
const quizEl=document.getElementById("quiz");
const progressEl=document.getElementById("progress");

function loadQuestion(){
  answered=false;
  const q=questions[current];

  progressEl.style.width=((current/questions.length)*100)+"%";

  quizEl.innerHTML=`
    <div class="question">
      Question ${current+1} of ${questions.length}<br><br>
      ${q.question}
    </div>
    <div class="options">
      ${q.options.map((opt,i)=>
        `<button onclick="selectOption(${i},this)">${opt}</button>`
      ).join("")}
    </div>
    <div id="explanation"></div>
  `;
}

function selectOption(index,btn){
  if(answered)return;
  answered=true;

  const q=questions[current];
  const buttons=document.querySelectorAll(".options button");

  buttons.forEach((b,i)=>{
    if(i===q.correctIndex)b.classList.add("correct");
    if(i===index && i!==q.correctIndex)b.classList.add("wrong");
    b.disabled=true;
  });

  if(index===q.correctIndex)score++;

  document.getElementById("explanation").innerHTML=`
    <div class="explanation">
      ${q.explanation}
      <br><br>
      <button class="next-btn" onclick="nextQuestion()">Next</button>
    </div>
  `;
}

function nextQuestion(){
  current++;
  if(current<questions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  progressEl.style.width="100%";
  quizEl.innerHTML=`
    <div class="result">
      <h2>Quiz Completed 🎉</h2>
      <p>You scored <strong>${score}</strong> / ${questions.length}</p>
      <br>
      <button class="next-btn" onclick="location.reload()">Restart Quiz</button>
    </div>
  `;
}

loadQuestion();
</script>

</body>
</html>
